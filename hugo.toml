baseURL = 'https://mukii.space/'
languageCode = 'en-us'
title = 'mukii.space'
mainSections = []

theme = 'mukii'

[markup.goldmark.parser]
# lets layouts/_markup/render-image.html see stand-alone images (.IsBlock)
wrapStandAloneImageWithinParagraph = false

[markup.goldmark.renderer]
hardWraps = true
relativeURLs = true

[markup.goldmark.extensions.passthrough]
enable = true
[markup.goldmark.extensions.passthrough.delimiters]
block = [['$$', '$$']]
inline = [['$', '$']]

[params]
# name in the footer copyright (the site title is mukii.space)
copyrightName = 'MUKIMASTA'

# project pages may keep camera originals in their folder; only the resized
# copies the shortcodes make are published (Workers caps a file at 25 MiB)
[[cascade]]
[cascade.build]
publishResources = false
[cascade.target]
path = '{/projects/**}'
