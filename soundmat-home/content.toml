# Design-notes carousel. doc links the card to its source chapter;
# doc_label overrides that chapter's title.
[[design_notes]]
doc = "soundmat-2-philosophy"
date.zh = "2026.04.11"
date.en = "April 11, 2026"
body.zh = '''
所以，SoundMat 如何成为一个好的声音装置？

1. 音乐必须是耐听的，可重复的
1. 音乐必须是轻类型风格，不能让人觉得吵，是大众接受度高的
1. 交互简单直观，怎么放置都好听，但是依然能感受到参与感/反馈感
1. 有变化，即使是在无人的场景下依然有变化，最好能有曲式的起承转合
1. 沉浸的氛围感，营造一种氛围与感受而不是只是音乐播放器
'''
body.en = '''
So how does SoundMat become a good sound installation?

1. The music must be easy to listen to, and bear repeating
1. A light style of music: never loud or annoying, and easy for most people to like
1. Simple, intuitive interaction: it sounds good however things are placed, yet you can still feel your part in it
1. It keeps changing, even with no one around, ideally with a sense of musical form
1. An immersive atmosphere: a mood and a feeling, not just a music player
'''

[[design_notes]]
doc = "soundmat-2-philosophy"
small = true
date.zh = "2026.04.11"
date.en = "April 11, 2026"
body.zh = '''
场景：

晚上七点，大堂里没有背景音乐播放器，只有一张低矮的圆形木台，上面摆着三块大小不一的黑色火山石。石头下面传出极缓慢的、像寺庙钟声余韵一样的声音，和大堂里的檀香味融在一起。一位住客办完入住走过来，没有人告诉她这是什么，她只是觉得声音好听，把旁边的一块鹅卵石放到了垫子边缘，一层轻微的风铃声加了进来。她停了几秒听了听，然后去房间了。鹅卵石留在上面，音乐继续，工作人员不急着收——这就是大堂的一部分。第二天早上，另一位工作人员换了石头的位置，今天的音乐和昨天不一样了。
'''
body.en = '''
Scene:

Seven in the evening. The lobby has no background music, only a low, round wooden platform with three black volcanic stones of different sizes. From beneath them comes a very slow sound, like the fading ring of a temple bell, mingling with the sandalwood in the air. A guest who has just checked in walks over. No one has told her what it is; she just likes the sound, and sets a nearby pebble at the edge of the mat. A faint layer of wind chimes joins in. She listens for a few seconds, then heads to her room. The pebble stays, the music goes on, and the staff are in no hurry to clear it: it is part of the lobby. The next morning, another staff member moves the stones, and today’s music is different from yesterday’s.
'''

[[design_notes]]
doc = "soundmat-2-philosophy"
date.zh = "2026.04.11"
date.en = "April 11, 2026"
body.zh = "我想，真正重要的是产品整体给人带来的感觉与氛围，所谓艺术装置，与这个空间连结，与路人互动。它在那里，本身就是一种美学。"
body.en = "I think what really matters is the feeling and the atmosphere the whole thing creates. An art installation connects with its space and plays with the people passing by. Simply being there is an aesthetic in itself."

[[design_notes]]
doc = "soundmat-3-exterior-design"
date.zh = "2026.04.12"
date.en = "April 12, 2026"
body.zh = "表面我想用绒状织物，吸引视觉，有温馨与高级感；摆放的物品，鹅卵石是最佳的选择，天然有重量和大小差异、手感好，和高雅的场景天然匹配。"
body.en = "For the surface I want a soft pile fabric: it draws the eye, and feels warm and refined. For the things people place, river pebbles are the best choice. They vary naturally in weight and size, feel good in the hand, and suit refined settings."

[[design_notes]]
doc = "soundmat-3-exterior-design"
date.zh = "2026.04.12"
date.en = "April 12, 2026"
body.zh = "克制、自然、高级感。外观上浅下深让表面“浮”起来，注意力集中在操作面上。整体不像电子产品，像一件家具或艺术品。"
body.en = "Restrained, natural, refined. A light top over a dark body makes the surface seem to float, and keeps attention on the surface you play. As a whole it looks less like an electronic product than a piece of furniture or an artwork."

[[design_notes]]
doc = "soundmat-6-electronics-system-design"
date.zh = "2026.05.11"
date.en = "May 11, 2026"
body.zh = '''
所有电子元件需要藏在空腔内，引出的线缆越少越好。我们只使用一根供电线和一根音频线。

作为艺术装置，在户外比如广场上使用时，最好能够直接解决供电问题而不用插座。PD 协议的 USB-C 供电可以解决这一点，既可以用充电器，也可以用快充充电宝供电。
'''
body.en = '''
All the electronics have to hide inside the cavity, with as few cables coming out as possible. We use just one power cable and one audio cable.

As an art installation used outdoors, say in a plaza, it should ideally solve its own power, with no wall socket. USB-C with Power Delivery does this: it runs from a charger or from a fast-charging power bank.
'''

[[design_notes]]
doc = "soundmat-8-interaction-and-sonification"
doc_label.zh = "SoundMat (8) 交互与声音化设计"
doc_label.en = "SoundMat (8) Interaction and Sonification Design"
date.zh = "2026.05"
date.en = "May 2026"
body.zh = '''
声音化设计是 SoundMat 的灵魂。

其中有两种控制思路：

调控是调整已有音乐的声音参数，例如一段音乐的音量、音色、高低频、速度等等。生成则是对于每个操作都实时生成元素，例如演奏音符、打击乐、和声、音乐片段等等。

在 SoundMat，生成是绝对的主导。用户不是去调整别人已有的音乐，而是自己创造音乐。
'''
body.en = '''
Sonification is the soul of SoundMat.

There are two ways to control it:

Adjusting changes the parameters of music that already exists, such as the volume, timbre, EQ or tempo of a piece. Generating creates new elements in real time for every action, such as notes, percussion, harmony or musical fragments.

In SoundMat, generation dominates completely. People are not adjusting someone else’s music; they are making their own.
'''

[[design_notes]]
doc = "soundmat-8-interaction-and-sonification"
doc_label.zh = "SoundMat (8) 交互与声音化设计"
doc_label.en = "SoundMat (8) Interaction and Sonification Design"
date.zh = "2026.05"
date.en = "May 2026"
body.zh = '''
我在想，能不能做一种“叙事的环境”，环境叙事让用户在放石头的过程中慢慢展开一个场景。我最想做的环境叙事就是日本寺院。

SoundMat 其中的一个环境音乐模式就是《京都岚山》。
'''
body.en = '''
I wondered whether we could make a “narrative environment”, where placing stones slowly unfolds a scene. The one I wanted most was a Japanese temple.

One of SoundMat’s ambient modes is *Kyoto Arashiyama*.
'''

