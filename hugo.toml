baseURL = 'https://mukii.space/'
languageCode = 'en-us'
title = 'mukii.space'
mainSections = []

theme = 'mukii'

[markup.goldmark.renderer]
hardWraps = true
relativeURLs = true

[markup.goldmark.extensions.passthrough]
enable = true
[markup.goldmark.extensions.passthrough.delimiters]
block = [['$$', '$$']]
inline = [['$', '$']]

[params]
# name in the footer copyright (the site title is mukii.space)
copyrightName = 'MUKIMASTA'
