<header class="site-header">
    <a class="site-title" href="{{ .Site.BaseURL }}">{{ .Site.Title }}</a>
    <nav class="site-nav" aria-label="Primary">
        <a href="{{ "professional-overview/" | relURL }}" class="site-nav__link{{ if eq .RelPermalink "/professional-overview/" }} is-active{{ end }}">Professional</a>
        <a href="{{ "journey/" | relURL }}" class="site-nav__link{{ if eq .RelPermalink "/journey/" }} is-active{{ end }}">Journey</a>
        <button class="theme-toggle" type="button" aria-label="切换深色模式" title="切换深色模式">
            <svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="6.5" fill="none" stroke="currentColor" stroke-width="1.2"/><path d="M8 1.5a6.5 6.5 0 0 1 0 13z" fill="currentColor"/></svg>
        </button>
    </nav>
</header>
