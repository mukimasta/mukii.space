[muzak]
question.zh = "当你进入一个公共空间时，<br>你听到的背景音乐是由谁决定的？"
question.en = "When you enter a public space, who decides the background music you hear?"
captive_title.zh = "被困住的听众"
captive_title.en = "Captive Audience"
captive_body.zh = '''
20 世纪中叶，[Muzak 音乐]^muzak开始在美国盛行，它逐渐进入商店、办公室和工厂。其中一个重要思想是：它将音乐视作可被组织和管理的环境元素，用来影响空间的氛围、人的情绪，[甚至人们工作和消费的方式]^stimulus。

这时的音乐，被设计用来作用于人们，影响人们的行为，人们成了[被困住的听众]^captive。
'''
captive_body.en = '''
In the mid-20th century, [Muzak music]^muzak began to thrive across America, finding its way into shops, offices, and factories. The central idea was to treat music as an environmental element that could be organized and managed to influence the atmosphere of a space, people's moods, and even [the ways they worked and shopped]^stimulus.

Music came to be designed to act upon people and influence their behavior. There is a term for those who cannot escape it: the [*captive audience*]^captive.
'''
eno_title.zh = "既可以被忽略，又值得被聆听"
eno_title.en = "As Ignorable as It Is Interesting"
eno_body.zh = '''
1978 年，Brian Eno 发行了[《Music for Airports》]^eno。Eno 在其中批评了 Muzak 音乐，称其为所有空间和其中的人们都添加一种同质化的刺激，把每个空间原本的声音和氛围都盖住、抹平了，拉平了人们的自然节律，丢失了真正的趣味。Eno 提出了氛围音乐（Ambient Music）的概念，他想要的是一种与环境共存的音乐，发挥空间本身的声学特点，为人们带来平静，留出思考的空间。

到了这里，音乐为空间与空间中的人们所设计，为人们提供一种开放、自由的环境体验，“既可以被忽略，又值得被聆听”。
'''
eno_body.en = '''
In 1978, Brian Eno released his [*Music for Airports*]^eno. In it, he criticized Muzak for imposing a homogenized stimulus on every space and everyone in it, blanketing each space’s own sounds and atmosphere, levelling out people’s natural rhythms, thus stripping away any genuine interest.

Eno proposed Ambient Music instead. He wanted music that coexists with its environment, draws on the acoustic character of the space itself, and leaves “a space to think.”

Music could now be made for spaces and the people in them, offering an open, free experience, as Eno put it: “as ignorable as it is interesting.”
'''
curated_title.zh = "被安排好的氛围"
curated_title.en = "The Curated Atmosphere"
curated_body.zh = '''
从 Muzak 到 Ambient Music，我们不断重新思考音乐应该如何与人、与环境相处，但有一件事似乎始终没有改变：我们每天身处的公共空间的背景音乐，都还是被设计好、被赋予在场者的，被空间的拥有者和设计者决定的。

音乐不仅是我们听到的内容，也是构成空间氛围的一部分。人们进入公共空间时，往往只是被动地接受被设计好的氛围。
'''
curated_body.en = '''
From Muzak to Ambient Music, we have kept rethinking how music should relate to people and their surroundings. Yet one thing seems never to have changed: the background music in the public spaces we move through every day is still designed and decided in advance by the owners and designers of the space, bestowed upon people there.

Music is not only something we hear, but also a part of what makes up the atmosphere of a space. When we enter a public space, we usually just receive an atmosphere that has already been designed for us.
'''
turn.zh = "但如果，一个空间的氛围，<br>可以由在场的人共同塑造呢？"
turn.en = "But what if the atmosphere of a space could be shaped together by the people in it?"

[shared]
title.zh = "SoundMat – 共同营造的氛围"
title.en = "SoundMat – Shared Ambience"
lead.zh = '''
我们希望，人们对于公共空间音乐氛围的营造能拥有更多主动权。从这个理念出发，我们设计了 SoundMat。

路过或停留的人，都可以挪动石头，轻轻改变整个空间的氛围。
'''
lead.en = '''
Starting from the idea of giving people greater agency in shaping the musical atmosphere of a space, we designed SoundMat.

Anyone passing through or lingering can move the stones, gently changing the atmosphere of the entire room.
'''
body.zh = '''
我们的设计希望最大限度地实现自由度与悦耳的平衡，无论如何放置，[音乐总是和谐好听]^harmony，但参与者仍然能感觉到这个改变是由他们做出的。他们不需要任何音乐基础，只需要一些好奇、想法与尝试。

氛围不再是播放给人听的，而是由在场的人一起营造的，他们共同塑造了空间的 <span class="term">Shared Ambience</span>（共同氛围）。

人们不再是被动的氛围接受者，而成了影响者。挪一颗石头，听着这个小小的动作充满了整个房间。石头留在原处，氛围也留了下来，人们走进空间，听到的是之前的人留下的声音，并影响着之后来到这里的每一个人，整个空间留下了他们的痕迹。
'''
body.en = '''
Our design seeks to find the best balance between creative freedom and good listening: however the stones are placed, [the music always sounds harmonious]^harmony, whereas participants can still feel that each change is their own. No musical background is needed, what they need is just some curiosity, imagination, and willingness to explore.

Atmosphere is no longer played to people, but created by the people present. Together, they shape the <span class="term">Shared Ambience</span>.

People are no longer passive receivers of atmosphere, but the ones who shape it. Move one stone, and hear that small gesture fill the whole room. The stone stays where it is, and so does the atmosphere. The next person receives what was left before, and shapes it for everyone who comes later. Their traces pervade the entire space.
'''

# Footnote cards, opened from [text]^id in the text above.
[notes.muzak]
title = "Muzak"
body.zh = "1934 年，Muzak 品牌开始提供商业音乐服务，随后逐渐进入酒店、餐厅、工厂、办公室等场所。它旋律简单、舒缓，结构简单、容易预测。Muzak 这个名字，是 music 和当时很火的 Kodak 拼起来的。后来它流行到小写的 muzak 成了“背景音乐”的代名词。"
body.en = "In 1934, the Muzak brand began offering commercial music services, and gradually spread into hotels, restaurants, factories, and offices. Its music had simple, soothing melodies and simple, predictable structures. The name Muzak combines “music” with Kodak, one of the most popular brands of the time. It later became so widespread that lowercase “muzak” turned into a byword for background music."
sources.zh = "[Mood Media (2022), The History of Muzak](https://us.moodmedia.com/blog/history-of-muzak/)；[HistoryLink, Muzak, Inc.](https://historylink.org/File/10072)"
sources.en = "[Mood Media (2022), The History of Muzak](https://us.moodmedia.com/blog/history-of-muzak/); [HistoryLink, Muzak, Inc.](https://historylink.org/File/10072)"

[notes.stimulus]
title.zh = "15 分钟的“刺激递进”"
title.en = "Fifteen-Minute “Stimulus Progression”"
body.zh = "Muzak 的招牌做法叫 Stimulus Progression。例如在工厂里，它把曲目编排成 15 分钟一组，让音乐从舒缓逐渐变得明快，期望以此减轻工人的疲劳、提高工作效率。"
body.en = "Muzak’s signature method was called Stimulus Progression. In factories, for example, music was arranged into 15-minute sequences, gradually progressing from calm to lively, in the hope of reducing workers’ fatigue and raising productivity."
sources.zh = "[Jones & Schumacher (1992), Muzak: On functional music and power](https://doi.org/10.1080/15295039209366822)；[Hui (2014), Muzak-While-You-Work](https://doi.org/10.7788/ha-2014-0306)"
sources.en = "[Jones & Schumacher (1992), Muzak: On functional music and power](https://doi.org/10.1080/15295039209366822); [Hui (2014), Muzak-While-You-Work](https://doi.org/10.7788/ha-2014-0306)"

[notes.captive]
title.zh = "被困住的听众"
title.en = "The Captive Audience"
body.zh = "1949 年 10 月起，纽约中央车站每天从早上 7 点到午夜，通过广播不间断地播放 Muzak 音乐和商业广告。旅客走不开，也关不掉，抗议随之而来。E. B. White 在《纽约客》上撰文批评：人们正在失去决定自己听不听的权利。三年后，类似的争论打到了美国最高法院：华盛顿特区的有轨电车在车厢里播放广播，乘客起诉。法院判电车公司胜诉，但 Douglas 大法官在反对意见里写下了一句话：“The streetcar audience is a captive audience.”（电车上的乘客，就是被困住的听众。）"
body.en = "Starting in October 1949, Grand Central Terminal in New York broadcast Muzak and commercials over its public address system nonstop, from 7 a.m. to midnight. Travelers could neither walk away nor turn it off, and protests followed. In *The New Yorker*, E. B. White wrote that people were losing the right to decide whether to listen at all. Three years later, a similar dispute reached the U.S. Supreme Court: streetcars in Washington, D.C. were playing radio broadcasts, and passengers sued. The Court ruled for the transit company, but Justice Douglas wrote in his dissent: “The streetcar audience is a captive audience.”"
sources.zh = "[Broadcasting (1949, Oct 10), Grand Central Voice](https://www.worldradiohistory.com/Archive-BC/BC-1949/1949-10-10-BC.pdf)；[The New Yorker (1949, Nov 5)](https://www.newyorker.com/magazine/1949/11/05/comment-3857)；[Public Utilities Commission v. Pollak (1952)](https://www.law.cornell.edu/supremecourt/text/343/451)；[Jordan (2014), Canned Music and Captive Audiences](https://doi.org/10.1080/10714421.2014.960734)"
sources.en = "[*Broadcasting* (1949, Oct 10), Grand Central Voice](https://www.worldradiohistory.com/Archive-BC/BC-1949/1949-10-10-BC.pdf); [*The New Yorker* (1949, Nov 5)](https://www.newyorker.com/magazine/1949/11/05/comment-3857); [Public Utilities Commission v. Pollak (1952)](https://www.law.cornell.edu/supremecourt/text/343/451); [Jordan (2014), Canned Music and Captive Audiences](https://doi.org/10.1080/10714421.2014.960734)"

[notes.eno]
title.zh = "自己组合的音乐"
title.en = "Music That Meets Itself"
body.zh = "Eno 录下乐手和歌手的单个音，做成长度不同的磁带循环，让它们自己相遇、组合。所以这段音乐里每个音什么时候出现，连 Eno 自己也无法事先知道。"
body.en = "Eno recorded single notes from musicians and singers, turned them into tape loops of different lengths, and let them meet and combine on their own. So when each note in the music appears is something even Eno could not know in advance."
sources.zh = "[Eno (1978), Music for Airports 唱片说明原文](https://tiranacalling.wordpress.com/2012/04/30/music-for-airports-liner-notes/)"
sources.en = "[Eno (1978), liner notes for Music for Airports](https://tiranacalling.wordpress.com/2012/04/30/music-for-airports-liner-notes/)"

[notes.harmony]
title.zh = "为什么怎么放都好听"
title.en = "Why It Always Sounds Good"
body.zh = "SoundMat 的音乐使用五声音阶的氛围音乐。这五个音不管怎么叠在一起，都不会出现刺耳的音程，所以无论石头放在哪里，都不会“弹错”。调性每隔几分钟沿五度圈缓缓转换，让音乐一直在变，却从不突兀。"
body.en = "SoundMat plays ambient music built on the pentatonic scale. However these five notes are stacked, they never form a harsh interval, so wherever the stones are placed, there are no “wrong notes.” Every few minutes, the key slowly shifts around the circle of fifths, so the music keeps changing without ever feeling abrupt."

